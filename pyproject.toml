[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zopyx.plone.persistentlogger"
version = "1.0.0a1"
description = "Object-scoped, tamper-evident audit logging for Plone"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "plone.api",
  "plone.protect",
  "zope.annotation",
  "zope.component",
  "zope.interface",
]

[project.optional-dependencies]
rdbms = ["duckdb>=1.2", "psycopg[binary]>=3.2"]
test = ["Plone>=6.2,<6.3", "pytest", "pytest-cov", "plone.app.testing"]
integration = ["psycopg[binary]>=3.2", "testcontainers[postgres]>=4.10"]
dev = ["watchfiles>=1.0"]
demo = [
  "Plone>=6.2,<6.3",
  "plone.app.contenttypes",
  "plonetheme.barceloneta",
]

[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[tool.setuptools.packages.find]
include = ["zopyx*"]

[tool.setuptools.package-data]
"zopyx.plone.persistentlogger" = ["*.zcml", "profiles/**/*", "browser/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: tests requiring Docker or external database services",
]

[tool.coverage.run]
branch = true
source = ["zopyx.plone.persistentlogger"]

[tool.coverage.report]
fail_under = 99
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
