    { name = "plone-app-testing" },
    { name = "pytest" },
    { name = "pytest-cov" },
]

[package.metadata]
requires-dist = [
    { name = "duckdb", marker = "extra == 'rdbms'", specifier = ">=1.2" },
    { name = "plone", marker = "extra == 'demo'", specifier = ">=6.2,<6.3" },
    { name = "plone", marker = "extra == 'test'", specifier = ">=6.2,<6.3" },
    { name = "plone-api" },
    { name = "plone-app-contenttypes", marker = "extra == 'demo'" },
    { name = "plone-app-testing", marker = "extra == 'test'" },
    { name = "plone-protect" },
    { name = "plonetheme-barceloneta", marker = "extra == 'demo'" },
    { name = "psycopg", extras = ["binary"], marker = "extra == 'integration'", specifier = ">=3.2" },
    { name = "psycopg", extras = ["binary"], marker = "extra == 'rdbms'", specifier = ">=3.2" },
    { name = "pytest", marker = "extra == 'test'" },
    { name = "pytest-cov", marker = "extra == 'test'" },
    { name = "testcontainers", extras = ["postgres"], marker = "extra == 'integration'", specifier = ">=4.10" },
    { name = "watchfiles", marker = "extra == 'dev'", specifier = ">=1.0" },
    { name = "zope-annotation" },
    { name = "zope-component" },
    { name = "zope-interface" },
]
provides-extras = ["rdbms", "test", "integration", "dev", "demo"]
