name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --extra test --extra rdbms
      - name: Run tests with coverage
        run: uv run --extra test --extra rdbms pytest --cov=zopyx.plone.persistentlogger --cov-branch --cov-report=term-missing --cov-fail-under=99
      - name: Build package
        run: uv build

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install integration dependencies
        run: uv sync --extra test --extra rdbms --extra integration
      - name: Run the PostgreSQL Testcontainers contract
        run: RUN_INTEGRATION=1 uv run --extra test --extra rdbms --extra integration pytest -q -m integration tests/test_rdbms_contract.py
